services:
  bizos-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - bizos_db_data:/var/lib/postgresql/data
    expose:
      - "5432"

  bizos-backend:
    build:
      context: ./backend
    depends_on:
      - bizos-db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@bizos-db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_CREDENTIALS_KEY: ${EMAIL_CREDENTIALS_KEY}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-business-os}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    expose:
      - "8000"

  bizos-frontend:
    build:
      context: ./nextjs_app
      args:
        BACKEND_URL: http://bizos-backend:8000
    depends_on:
      - bizos-backend
    environment:
      BACKEND_URL: http://bizos-backend:8000
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET}
      APP_HOST: ${APP_HOST}
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"

volumes:
  bizos_db_data:
